[project]
name = "kinu-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40,<2",
    "cryptography>=46,<48",
    "dkimpy>=1.1.8,<2",
    "dnspython>=2.8,<3",
    "fastapi>=0.116,<1",
    "kinu-contracts",
    "kinu-policy",
    "kinu-telemetry",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "pymongo>=4.16,<5",
    "pwdlib[argon2]>=0.3,<1",
    "bullmq>=2,<3",
    "redis>=6,<8",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.55,<2",
    "stagehand==4.3.0",
    "websockets>=15,<17",
]
mcp = ["httpx2>=2,<3", "mcp>=2,<3"]

[tool.uv.sources]
kinu-contracts = { workspace = true }
kinu-policy = { workspace = true }
kinu-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "broker", "browser", "capture", "connectors", "core", "demo", "emailer", "executor", "hosting", "ingestion", "integrations", "jobs", "mail", "notification", "rotation", "verifier"]
