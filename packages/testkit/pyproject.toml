[project]
name = "kinu-testkit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["kinu-contracts", "kinu-policy", "kinu-server"]

[tool.uv.sources]
kinu-contracts = { workspace = true }
kinu-policy = { workspace = true }
kinu-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testkit"]
