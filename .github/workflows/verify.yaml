name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KINU_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            agent/package-lock.json
      - name: Install dependencies
        run: make sync
      - name: Verify
        run: make verify
      - name: Verify Docker
        id: docker
        run: |
          python3 -m deploy.setup
          make image
          docker compose up -d --no-build --wait --wait-timeout 180
          python3 -m deploy.check
          docker compose exec -T executor python < deploy/browser.py
      - name: Diagnose Docker startup
        if: failure() && steps.docker.outcome == 'failure'
        run: |
          docker compose ps -a
          docker compose ps -aq | xargs -r docker inspect --format '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'
          docker compose logs --no-color --tail 80 mongo
      - name: Stop containers
        if: always() && steps.docker.outcome != 'skipped'
        run: docker compose down
