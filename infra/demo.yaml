AWSTemplateFormatVersion: '2010-09-09'
Description: Kinu isolated API rotation demo
Parameters:
  Organisation: {Type: String, AllowedPattern: '[a-z][a-z0-9_-]{2,127}'}
  ExternalId: {Type: String, MinLength: 32, NoEcho: true}
  PublicUrl: {Type: String}
  ClusterArn: {Type: String}
  DatabaseSecretArn: {Type: String}
  AssessArn: {Type: String}
  CodeBucket: {Type: String}
  CodeKey: {Type: String}
Resources:
  Keys:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: org, AttributeType: S}, {AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: org, KeyType: HASH}, {AttributeName: id, KeyType: RANGE}]
      SSESpecification: {SSEEnabled: true}
  ProviderSeed:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Kinu demo provider signing seed
      GenerateSecretString: {PasswordLength: 64, ExcludePunctuation: true}
  Key:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {Description: Kinu demo workload credential}
  Queue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1440
      MessageRetentionPeriod: 86400
      RedrivePolicy: {deadLetterTargetArn: !GetAtt DeadLetters.Arn, maxReceiveCount: 3}
  DeadLetters:
    Type: AWS::SQS::Queue
    Properties: {SqsManagedSseEnabled: true, MessageRetentionPeriod: 259200}
  ProviderApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: kinu-demo-provider, ProtocolType: HTTP}
  ProviderStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ProviderApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 4, ThrottlingRateLimit: 2}
  ProviderLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/kinu-demo-provider, RetentionInDays: 3}
  ConsumerLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/kinu-demo-consumer, RetentionInDays: 3}
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/kinu-worker, RetentionInDays: 3}
  ProviderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: provider
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref ProviderSeed}
              - {Effect: Allow, Action: 'secretsmanager:PutSecretValue', Resource: !Ref Key}
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt Keys.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kinu-demo-provider:*'
  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: consumer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref Key}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kinu-demo-consumer:*'
              - {Effect: Deny, Action: 'sts:AssumeRole', Resource: '*'}
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kinu-worker
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: workflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
                Resource: !Ref ClusterArn
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref DatabaseSecretArn}
              - {Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !Ref AssessArn}
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt Queue.Arn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/kinu-demo-access'
                Condition:
                  StringEquals: {'sts:ExternalId': !Ref ExternalId, 'aws:RequestTag/kinu-org': !Ref Organisation}
              - Effect: Allow
                Action: sts:TagSession
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/kinu-demo-access'
                Condition:
                  StringEquals: {'aws:RequestTag/kinu-org': !Ref Organisation}
                  'ForAllValues:StringEquals': {'aws:TagKeys': [kinu-org]}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kinu-worker:*'
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kinu-demo-access
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !GetAtt WorkerRole.Arn}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'sts:ExternalId': !Ref ExternalId, 'aws:RequestTag/kinu-org': !Ref Organisation}
              'ForAllValues:StringEquals': {'aws:TagKeys': [kinu-org]}
          - Effect: Allow
            Principal: {AWS: !GetAtt WorkerRole.Arn}
            Action: sts:TagSession
            Condition:
              StringEquals: {'aws:RequestTag/kinu-org': !Ref Organisation}
              'ForAllValues:StringEquals': {'aws:TagKeys': [kinu-org]}
      Policies:
        - PolicyName: selected-demo-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:ListSecretVersionIds, secretsmanager:UpdateSecretVersionStage]
                Resource: !Ref Key
              - Effect: Allow
                Action: [lambda:GetFunctionConfiguration, lambda:GetAlias, lambda:UpdateAlias, lambda:ListVersionsByFunction, lambda:PublishVersion, lambda:UpdateFunctionConfiguration, lambda:InvokeFunction]
                Resource: [!GetAtt Consumer.Arn, !Sub '${Consumer.Arn}:*']
              - Effect: Allow
                Action: [lambda:GetFunctionConfiguration, lambda:InvokeFunction]
                Resource: !GetAtt Provider.Arn
  Provider:
    Type: AWS::Lambda::Function
    DependsOn: ProviderLogs
    Properties:
      FunctionName: kinu-demo-provider
      Runtime: python3.12
      Handler: cloud.provider.handler
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt ProviderRole.Arn
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          KINU_DEMO_ORGANISATION: !Ref Organisation
          KINU_DEMO_TABLE: !Ref Keys
          KINU_DEMO_SEED: !Ref ProviderSeed
          KINU_DEMO_KEY: !Ref Key
          KINU_DEMO_ORIGIN: !Sub 'https://${ProviderApi}.execute-api.${AWS::Region}.amazonaws.com'
  Consumer:
    Type: AWS::Lambda::Function
    DependsOn: ConsumerLogs
    Properties:
      FunctionName: kinu-demo-consumer
      Runtime: python3.12
      Handler: cloud.consumer.handler
      MemorySize: 256
      Timeout: 20
      Role: !GetAtt ConsumerRole.Arn
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          KINU_DEMO_ORGANISATION: !Ref Organisation
          KINU_DEMO_KEY: !Ref Key
          KINU_PROVIDER_URL: !Sub 'https://${ProviderApi}.execute-api.${AWS::Region}.amazonaws.com'
          KINU_SECRET_VERSION: setup-required
  ProviderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref ProviderApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt Provider.Arn, PayloadFormatVersion: '2.0'}
  ProviderRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref ProviderApi, RouteKey: '$default', Target: !Sub 'integrations/${ProviderIntegration}'}
  ProviderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Provider
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProviderApi}/*'
  Worker:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogs
    Properties:
      FunctionName: kinu-worker
      Runtime: python3.12
      Handler: cloud.worker.handler
      MemorySize: 512
      Timeout: 240
      Role: !GetAtt WorkerRole.Arn
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          KINU_ENVIRONMENT: production
          KINU_PUBLIC_URL: !Ref PublicUrl
          KINU_DATA_API_CLUSTER_ARN: !Ref ClusterArn
          KINU_DATA_API_SECRET_ARN: !Ref DatabaseSecretArn
          KINU_DEMO_ORGANISATION: !Ref Organisation
          KINU_DEMO_PROVIDER: !GetAtt Provider.Arn
          KINU_DEMO_CONSUMER: !GetAtt Consumer.Arn
          KINU_DEMO_KEY: !Ref Key
          KINU_ASSESS_FUNCTION: !Ref AssessArn
  Jobs:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt Queue.Arn
      FunctionName: !Ref Worker
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 2}
Outputs:
  ProviderArn: {Value: !GetAtt Provider.Arn}
  ProviderUrl: {Value: !Sub 'https://${ProviderApi}.execute-api.${AWS::Region}.amazonaws.com'}
  ConsumerArn: {Value: !GetAtt Consumer.Arn}
  KeyArn: {Value: !Ref Key}
  AccessRoleArn: {Value: !GetAtt AccessRole.Arn}
  WorkerRoleArn: {Value: !GetAtt WorkerRole.Arn}
  WorkerArn: {Value: !GetAtt Worker.Arn}
  QueueUrl: {Value: !Ref Queue}
  QueueArn: {Value: !GetAtt Queue.Arn}
  Organisation: {Value: !Ref Organisation}
