AWSTemplateFormatVersion: '2010-09-09'
Description: Kinu HTTPS application and API
Parameters:
  ClusterArn: {Type: String}
  DatabaseSecretArn: {Type: String}
  CognitoPool: {Type: String}
  CognitoClient: {Type: String}
  CodeBucket: {Type: String}
  CodeKey: {Type: String}
  DemoQueueArn: {Type: String, Default: ''}
  DemoQueueUrl: {Type: String, Default: ''}
  DemoOrganisation: {Type: String, Default: ''}
  ConnectorArn: {Type: String, Default: ''}
  ConnectionPrincipals: {Type: String, Default: ''}
  RotationQueueArn: {Type: String, Default: ''}
  RotationQueueUrl: {Type: String, Default: ''}
  GmailArn: {Type: String, Default: ''}
Conditions:
  HasDemo: !Not [!Equals [!Ref DemoQueueArn, '']]
  HasConnections: !Not [!Equals [!Ref ConnectorArn, '']]
  HasRotations: !Not [!Equals [!Ref RotationQueueArn, '']]
  HasGmail: !Not [!Equals [!Ref GmailArn, '']]
Resources:
  Site:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: kinu
      ProtocolType: HTTP
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - !If
          - HasGmail
          - PolicyName: gmail-connection
            PolicyDocument:
              Version: '2012-10-17'
              Statement: [{Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !Ref GmailArn}]
          - !Ref AWS::NoValue
        - !If
          - HasConnections
          - PolicyName: connection-checks
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - {Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !Ref ConnectorArn}
          - !Ref AWS::NoValue
        - !If
          - HasRotations
          - PolicyName: rotation-dispatch
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - {Effect: Allow, Action: 'sqs:SendMessage', Resource: !Ref RotationQueueArn}
          - !Ref AWS::NoValue
        - !If
          - HasDemo
          - PolicyName: demo-dispatch
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - {Effect: Allow, Action: 'sqs:SendMessage', Resource: !Ref DemoQueueArn}
          - !Ref AWS::NoValue
        - PolicyName: application-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [rds-data:ExecuteStatement, rds-data:BeginTransaction, rds-data:CommitTransaction, rds-data:RollbackTransaction]
                Resource: !Ref ClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kinu-api:*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Site.Arn}/*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/kinu-api
      RetentionInDays: 3
  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: kinu-api
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: cloud.api.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 29
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          KINU_ENVIRONMENT: production
          KINU_DEMO_QUEUE_URL: !Ref DemoQueueUrl
          KINU_DEMO_ORGANISATION: !Ref DemoOrganisation
          KINU_CONNECTOR_FUNCTION: !Ref ConnectorArn
          KINU_CONNECTION_PRINCIPALS: !Ref ConnectionPrincipals
          KINU_ROTATION_QUEUE_URL: !Ref RotationQueueUrl
          KINU_GMAIL_FUNCTION: !Ref GmailArn
          KINU_SITE_BUCKET: !Ref Site
          KINU_AWS_REGION: !Ref AWS::Region
          KINU_DATA_API_CLUSTER_ARN: !Ref ClusterArn
          KINU_DATA_API_SECRET_ARN: !Ref DatabaseSecretArn
          KINU_COGNITO_POOL_ID: !Ref CognitoPool
          KINU_COGNITO_CLIENT_ID: !Ref CognitoClient
          KINU_PUBLIC_URL: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'
Outputs:
  ApiId: {Value: !Ref Api}
  ApiRoleArn: {Value: !GetAtt ApiRole.Arn}
  PublicUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  SiteBucket:
    Value: !Ref Site
  ApiOrigin:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
